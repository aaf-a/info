<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your IP Information</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:#fff;
    border-radius:12px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.card{
    background:#f8fafc;
    padding:15px;
    border-radius:8px;
    border-left:4px solid #007bff;
}

.label{
    font-size:12px;
    color:#666;
    margin-bottom:5px;
}

.value{
    font-size:16px;
    font-weight:bold;
    color:#222;
    word-break:break-word;
}

.loading{
    text-align:center;
    font-size:18px;
    color:#555;
}

.copy-btn{
    margin-top:10px;
    padding:10px 15px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.copy-btn:hover{
    background:#0056b3;
}

@media(max-width:600px){
    .info{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>Your IP Information</h1>

<div id="loading" class="loading">
Detecting your IP and location...
</div>

<div id="result" class="info" style="display:none;"></div>

</div>

<script>

let currentIP = "";

async function getIPInfo() {

    try {

        // Step 1: Get public IP
        const ipResponse = await fetch(
            "https://api64.ipify.org?format=json"
        );

        const ipData = await ipResponse.json();

        currentIP = ipData.ip;

        // Step 2: Query ipapi using the IP
        const geoResponse = await fetch(
            `https://ipapi.co/${currentIP}/json/`
        );

        const data = await geoResponse.json();

        const fields = [
            ["IP Address", currentIP],
            ["Country", data.country_name],
            ["Country Code", data.country_code],
            ["Region", data.region],
            ["City", data.city],
            ["Postal Code", data.postal],
            ["Latitude", data.latitude],
            ["Longitude", data.longitude],
            ["Timezone", data.timezone],
            ["ISP / Organization", data.org],
            ["ASN", data.asn],
            ["Currency", data.currency],
            ["Languages", data.languages]
        ];

        let html = "";

        fields.forEach(item => {

            html += `
            <div class="card">
                <div class="label">${item[0]}</div>
                <div class="value">${item[1] || "N/A"}</div>
            </div>
            `;

        });

        html += `
        <div class="card">
            <div class="label">Actions</div>
            <button class="copy-btn" onclick="copyIP()">
                Copy IP Address
            </button>
        </div>
        `;

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("result").style.display =
            "grid";

        document.getElementById("result").innerHTML = html;

    }
    catch(error){

        console.error(error);

        document.getElementById("loading").innerHTML =
            "Unable to fetch IP information.";

    }
}

function copyIP(){

    navigator.clipboard.writeText(currentIP);

    alert("IP copied: " + currentIP);
}

getIPInfo();

</script>

</body>
</html>
