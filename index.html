<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My IP Information</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#3b82f6;
    --text:#ffffff;
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:2rem;
}

.ip-box{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    text-align:center;
    margin-bottom:20px;
}

.ip{
    font-size:1.8rem;
    font-weight:bold;
    color:#60a5fa;
    margin:10px 0;
}

.copy-btn{
    background:var(--accent);
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.copy-btn:hover{
    opacity:.9;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:var(--card);
    border-radius:12px;
    padding:18px;
}

.label{
    color:var(--muted);
    font-size:.85rem;
    margin-bottom:5px;
}

.value{
    font-size:1.05rem;
    font-weight:600;
    word-break:break-word;
}

.flag{
    width:60px;
    border-radius:4px;
    margin-top:10px;
}

#map{
    height:400px;
    border-radius:12px;
    margin-top:20px;
}

.loading{
    text-align:center;
    padding:30px;
    font-size:1.1rem;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:var(--muted);
    font-size:.9rem;
}
</style>
</head>
<body>

<div class="container">

<h1>🌍 My IP Information</h1>

<div id="loading" class="loading">
Loading your IP information...
</div>

<div id="content" style="display:none;">

<div class="ip-box">
    <div>Your Public IP Address</div>
    <div class="ip" id="ipAddress">Loading...</div>

    <button class="copy-btn" onclick="copyIP()">
        Copy IP
    </button>
</div>

<div class="grid" id="cards"></div>

<div id="map"></div>

<div class="footer">
    Approximate location based on IP address.
</div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let currentIP = "";

async function getIPInfo() {

    try {

        // Get public IP
        const ipResponse = await fetch(
            "https://api64.ipify.org?format=json"
        );

        const ipData = await ipResponse.json();
        currentIP = ipData.ip;

        // Lookup geolocation
        const geoResponse = await fetch(
            `https://ipwho.is/${currentIP}`
        );

        const data = await geoResponse.json();

        if (!data.success) {
            throw new Error("Location lookup failed");
        }

        document.getElementById("ipAddress").textContent =
            currentIP;

        const cards = [
            ["Country", data.country],
            ["Country Code", data.country_code],
            ["Region", data.region],
            ["City", data.city],
            ["Postal Code", data.postal],
            ["Continent", data.continent],
            ["Timezone", data.timezone.id],
            ["UTC Offset", data.timezone.utc],
            ["ISP", data.connection.isp],
            ["Organization", data.connection.org],
            ["ASN", data.connection.asn],
            ["Latitude", data.latitude],
            ["Longitude", data.longitude]
        ];

        let html = "";

        cards.forEach(item => {

            html += `
                <div class="card">
                    <div class="label">${item[0]}</div>
                    <div class="value">${item[1] || "N/A"}</div>
                </div>
            `;

        });

        html += `
            <div class="card">
                <div class="label">Country Flag</div>
                <img
                    class="flag"
                    src="${data.flag.img}"
                    alt="flag">
            </div>
        `;

        document.getElementById("cards").innerHTML = html;

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("content").style.display =
            "block";

        initMap(
            data.latitude,
            data.longitude,
            data.city
        );

    }

    catch(error){

        console.error(error);

        document.getElementById("loading").innerHTML = `
            <div>
                Unable to fetch IP information.
                <br><br>
                Check browser console for details.
            </div>
        `;
    }
}

function initMap(lat, lon, city){

    const map = L.map("map").setView([lat, lon], 10);

    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
            '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    L.marker([lat, lon])
        .addTo(map)
        .bindPopup(city || "Approximate Location")
        .openPopup();
}

function copyIP(){

    navigator.clipboard.writeText(currentIP);

    alert("IP copied: " + currentIP);
}

getIPInfo();

</script>

</body>
</html>
